name: Installer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /install.py
            /tests/
            /skills/inference-engine/library/ncu-report/helpers/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - name: Install from private GitHub using the documented command
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_HOME: ${{ runner.temp }}/bootstrap-codex
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' repos/hehesnail/inference-engine-skill/contents/install.py | python - --update
      - name: Verify downloaded installation and portable tool entrypoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CODEX_HOME: ${{ runner.temp }}/bootstrap-codex
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["CODEX_HOME"]) / "skills"
          for name in ("inference-engine", "lmdeploy-pipeline", "pytorch-refactor"):
              assert (root / name / "SKILL.md").is_file(), name
              assert (root / name / ".installation.json").is_file(), name
          subprocess.run([sys.executable, str(root / "inference-engine/scripts/offline_tools.py"), "--help"], check=True)
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refresh_distribution.py --check
      - run: python install.py --source . --dest "$RUNNER_TEMP/skill-check/skills"
      - run: python install.py --source . --dest "$RUNNER_TEMP/skill-check/skills" --check
